[project]
name = "jre-vidget"
version = "0.1.0"
description = "CLI video downloader built on yt-dlp — a local replacement for iTube Studio"
readme = "README.md"
authors = [
    { name = "jreakin", email = "johnreakin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "yt-dlp>=2024.1.1",
    "ffmpeg-python>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",        # async test client for FastAPI
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
vidget = "jre_vidget.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer uses Option()/Argument() in parameter defaults by design.
"src/jre_vidget/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jre_vidget"]
