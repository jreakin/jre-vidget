name: Deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Unit tests (Vitest)
        run: npm test
        working-directory: web

      - name: Build
        env:
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          # Prefer repo variable if set; otherwise current repo (forks work without extra vars).
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || github.repository }}
        run: npm run build
        working-directory: web

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
