name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    name: Conventional commit format
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"

          echo "Checking PR title: $TITLE"

          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "✅ PR title is valid: $TITLE"
            exit 0
          fi

          echo ""
          echo "❌ Invalid PR title: $TITLE"
          echo "   Expected format: <type>(<scope>)?: <description>  (scope optional; use ! for breaking changes)"
          echo "   Example: fix(engine): handle None return from yt-dlp"
          echo ""
          echo "   Valid types:"
          echo "     feat      — new feature (bumps minor version)"
          echo "     fix       — bug fix (bumps patch version)"
          echo "     perf      — performance improvement (bumps patch)"
          echo "     docs      — documentation only"
          echo "     refactor  — code change without feature or fix"
          echo "     test      — adding or updating tests"
          echo "     build     — build system or dependency changes"
          echo "     ci        — CI/CD changes"
          echo "     chore     — maintenance tasks"
          echo "     revert    — reverts a previous commit"
          echo ""
          echo "   Breaking change: append ! before the colon"
          echo "     feat!: drop Python 3.10 support"
          echo ""
          echo "   With scope:"
          echo "     fix(engine): handle None return from yt-dlp"
          echo "     feat(cli): add --json flag to preview command"
          echo ""
          echo "   This title becomes the squash-merge commit message."
          echo "   release-please reads it to decide the next version and"
          echo "   what goes in the CHANGELOG."
          echo ""
          exit 1
