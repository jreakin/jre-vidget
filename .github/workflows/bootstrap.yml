name: Bootstrap — set up repo secrets and variables

on:
  workflow_dispatch:
    inputs:
      app_title:
        description: "Web UI title (shown in the top bar)"
        required: false
        default: "My vidget"
        type: string

# NOTE: GitHub Actions cannot create or update secrets — this is a hard
# platform restriction. GITHUB_TOKEN does not have secrets:write permission
# regardless of what is declared here.
#
# This workflow does what it CAN do automatically:
#   ✅  Set repository variables (VITE_GITHUB_REPO, VITE_APP_TITLE)
#   ✅  Check which secrets are already configured
#   ✅  Write a job summary with exact instructions for the missing ones
#
# Secrets must be created by a human or via the setup script:
#   scripts/setup-secrets.sh  (requires: gh auth login, then run locally)

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # needed to set repository variables via gh CLI
      contents: read

    steps:
      - uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # Variables: these CAN be set by GITHUB_TOKEN
      # -----------------------------------------------------------------------
      - name: Set repository variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set VITE_GITHUB_REPO \
            --body "$GITHUB_REPOSITORY" \
            --repo "$GITHUB_REPOSITORY"
          echo "set: VITE_GITHUB_REPO = $GITHUB_REPOSITORY"

          TITLE="${{ inputs.app_title }}"
          gh variable set VITE_APP_TITLE \
            --body "${TITLE:-My vidget}" \
            --repo "$GITHUB_REPOSITORY"
          echo "set: VITE_APP_TITLE = ${TITLE:-My vidget}"

      # -----------------------------------------------------------------------
      # Secrets: check what's already present (we can read names, not values)
      # -----------------------------------------------------------------------
      - name: Check secret status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SECRETS=$(gh secret list --repo "$GITHUB_REPOSITORY" --json name -q '.[].name' 2>/dev/null || echo "")

          check() {
            echo "$SECRETS" | grep -Fxq "$1" && echo "✅" || echo "❌"
          }

          CLIENT_ID=$(check "VIDGET_CLIENT_ID")
          CLIENT_SECRET=$(check "VIDGET_CLIENT_SECRET")
          REFRESH_TOKEN=$(check "VIDGET_REFRESH_TOKEN")
          REPORT_TOKEN=$(check "VIDGET_REPORT_TOKEN")

          echo "client_id=$CLIENT_ID"           >> "$GITHUB_OUTPUT"
          echo "client_secret=$CLIENT_SECRET"   >> "$GITHUB_OUTPUT"
          echo "refresh_token=$REFRESH_TOKEN"   >> "$GITHUB_OUTPUT"
          echo "report_token=$REPORT_TOKEN"     >> "$GITHUB_OUTPUT"

          # Fail the workflow if any required secrets are missing
          if [[ "$CLIENT_ID" == "❌" || "$CLIENT_SECRET" == "❌" || "$REFRESH_TOKEN" == "❌" ]]; then
            echo "missing_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Job summary: instructions for whatever is still missing
      # -----------------------------------------------------------------------
      - name: Write setup summary
        env:
          CLIENT_ID:      ${{ steps.check.outputs.client_id }}
          CLIENT_SECRET:  ${{ steps.check.outputs.client_secret }}
          REFRESH_TOKEN:  ${{ steps.check.outputs.refresh_token }}
          REPORT_TOKEN:   ${{ steps.check.outputs.report_token }}
          MISSING:        ${{ steps.check.outputs.missing_secrets }}
        run: |
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          SECRETS_URL="${REPO_URL}/settings/secrets/actions"
          VARS_URL="${REPO_URL}/settings/variables/actions"
          PAGES_URL="${REPO_URL}/settings/pages"
          SETUP_URL="${REPO_URL}/blob/main/docs/SETUP.md"
          WEB_UI_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          # vidget setup checklist

          ## Variables ✅
          These were set automatically:
          | Variable | Value |
          |----------|-------|
          | \`VITE_GITHUB_REPO\` | \`$GITHUB_REPOSITORY\` |
          | \`VITE_APP_TITLE\` | \`${{ inputs.app_title }}\` |

          [View variables →]($VARS_URL)

          ## Secrets
          > ⚠️ GitHub Actions cannot create secrets on your behalf.
          > You must add these yourself — see the options below.

          | Secret | Status | Purpose |
          |--------|--------|---------|
          | \`VIDGET_CLIENT_ID\` | $CLIENT_ID | Google OAuth app identity |
          | \`VIDGET_CLIENT_SECRET\` | $CLIENT_SECRET | Google OAuth app credential |
          | \`VIDGET_REFRESH_TOKEN\` | $REFRESH_TOKEN | Your YouTube channel access |
          | \`VIDGET_REPORT_TOKEN\` | $REPORT_TOKEN | *(optional)* Auto-report errors upstream |

          SUMMARY

          if [ "$MISSING" = "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY

          ### Option A — set secrets from your terminal (fastest)

          \`\`\`bash
          # Requires: gh auth login (GitHub CLI, already authenticated)
          bash scripts/setup-secrets.sh
          \`\`\`

          ### Option B — set secrets manually in the browser

          Go to [Settings → Secrets → Actions]($SECRETS_URL) and add each missing secret.
          See [docs/SETUP.md]($SETUP_URL) for instructions on obtaining each value.

          SUMMARY
          else
            cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY

          All required secrets are configured ✅

          SUMMARY
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY

          ## One-time repo settings

          - [ ] Enable GitHub Pages: [Settings → Pages]($PAGES_URL) → Source: **Deploy from a branch** → Branch: **gh-pages** / **/ (root)**
          - [ ] After secrets are set, run **Deploy web UI** to publish your page
          - [ ] Test with a real URL using **Download & publish to YouTube**

          ## Links
          - [Full setup guide]($SETUP_URL)
          - [Actions tab]($REPO_URL/actions)
          - [Your web UI (once Pages is enabled)]($WEB_UI_URL)

          SUMMARY

      - name: Fail if required secrets are missing
        if: steps.check.outputs.missing_secrets == 'true'
        run: |
          echo "::error::One or more required secrets are not set."
          echo "::error::See the job summary above for setup instructions."
          exit 1
