[project]
name = "jre-vidget"
version = "0.1.2"
description = "CLI video downloader built on yt-dlp — a local replacement for iTube Studio"
readme = "README.md"
authors = [
    { name = "jreakin", email = "johnreakin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "yt-dlp>=2024.1.1",
    "ffmpeg-python>=0.2",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=4",
    "radon>=6",
    "ruff>=0.4",
    "ty>=0.0.0a1",
    "vulture>=2",
]

[project.scripts]
vidget = "jre_vidget.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer uses Option()/Argument() in parameter defaults by design.
"src/jre_vidget/cli.py" = ["B008"]
"src/jre_vidget/commands/*.py" = ["B008"]

[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[[tool.ty.overrides]]
# google-auth / googleapiclient are not fully typed; relax imports in these files only.
include = ["src/jre_vidget/auth.py", "src/jre_vidget/publisher.py"]

[tool.ty.overrides.analysis]
replace-imports-with-any = [
    "google.**",
    "googleapiclient.**",
    "google_auth_oauthlib.**",
    "google_auth_httplib2.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_dependency_checks: run real check_dependencies (disables autouse mock)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jre_vidget"]
