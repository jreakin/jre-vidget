name: Production CI

# Tier 3: runs after a GitHub Release is published (triggered by release-please).
# Validates the package builds, installs cleanly, and the CLI entry point works.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate (e.g. v0.2.0)"
        required: false

jobs:
  # ── Build the distribution ───────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Install from wheel and smoke-test the CLI ────────────────────────────
  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from wheel
        run: |
          pip install dist/*.whl

      - name: CLI entry point responds
        run: |
          vidget --help
          vidget --version

      - name: Package imports cleanly
        run: |
          python -c "import jre_vidget; print('import OK')"
          python -c "from jre_vidget.models import DownloadConfig; print('models OK')"

  # ── Version tag matches pyproject.toml ───────────────────────────────────
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pyproject.toml version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"  # strip leading 'v'
          PKG_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml | head -1)
          echo "Tag version:     $TAG"
          echo "Package version: $PKG_VERSION"
          if [[ "$TAG" != "$PKG_VERSION" ]]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Versions match."
